<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Notes Hub — interface demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --background:#f5f5f7; --foreground:#1d1d1f; --surface:#ffffff;
    --border:#e5e5e7; --muted:#62636a; --accent:#0071e3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--background); color:var(--foreground);
    font-family:'Inter', system-ui, Arial, sans-serif;
    font-size:14px;
  }
  .ribbon{
    background:#1d1d1f; color:#f5f5f7; text-align:center;
    padding:8px 12px; font-size:12px; letter-spacing:.3px;
  }
  .ribbon b{color:#ffd60a;}
  .shell{display:flex; height:calc(100vh - 36px); flex-direction:column;}
  .searchbar{
    display:flex; align-items:center; gap:10px; height:56px; flex-shrink:0;
    border-bottom:1px solid var(--border); background:rgba(255,255,255,.85);
    padding:8px 16px; backdrop-filter:blur(6px);
  }
  .searchbar .brand{font-weight:700; font-size:14px; white-space:nowrap; margin-right:8px;}
  .menu-button{display:none; align-items:center; justify-content:center; width:32px; height:32px; border:0; border-radius:7px; background:transparent; color:var(--muted); cursor:pointer;}
  .menu-button:hover{background:rgba(0,0,0,.05); color:var(--foreground);}
  .searchwrap{position:relative; width:100%; max-width:420px;}
  .searchwrap svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted);}
  .searchbar input{
    width:100%; border:1px solid var(--border); border-radius:8px; background:var(--background);
    padding:7px 56px 7px 34px; font-size:14px; color:var(--foreground); outline:none;
  }
  .searchbar input:focus{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .search-shortcut{position:absolute; right:9px; top:50%; transform:translateY(-50%); padding:2px 5px; border:1px solid var(--border); border-radius:5px; background:var(--surface); color:var(--muted); font-family:inherit; font-size:11px; line-height:1.2; pointer-events:none;}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
  .search-popup{
    position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:50;
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.08); max-height:320px; overflow:auto; display:none;
  }
  .search-popup.open{display:block;}
  .search-popup .sr{display:block; width:100%; padding:9px 12px; border:0; border-bottom:1px solid var(--border); background:transparent; color:var(--foreground); text-align:left; font:inherit; cursor:pointer; outline:none;}
  .search-popup .empty-result{color:var(--muted); cursor:default;}
  .search-popup .sr:hover,.search-popup .sr.active{background:rgba(0,113,227,.08);}
  .search-popup .sr b{font-weight:600; font-size:13px; display:block;}
  .search-popup .sr span{font-size:12px; color:var(--muted); display:block;}
  .body{display:flex; flex:1; min-height:0;}
  /* Sidebar */
  .sidebar{
    width:256px; flex-shrink:0; display:flex; flex-direction:column;
    border-right:1px solid var(--border); background:rgba(255,255,255,.6);
  }
  .sidebar-backdrop{display:none;}
  .side-head{display:flex; align-items:center; justify-content:space-between; padding:16px 16px 8px;}
  .side-head h2{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
  .folder{width:calc(100% - 12px); padding:10px 12px; border:0; background:transparent; color:inherit; text-align:left; font-family:inherit; font-size:14px; border-radius:6px; margin:0 6px 2px; cursor:pointer; display:flex; justify-content:space-between;}
  .folder:hover{background:rgba(0,0,0,.05);}
  .folder.active{background:rgba(0,113,227,.12); color:var(--accent); font-weight:500;}
  .folder .count{color:var(--muted); font-size:12px;}
  .tags-wrap{padding:16px 16px 6px;}
  .tags-wrap h2{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px;}
  .taglist{display:flex; flex-wrap:wrap; gap:6px; padding:0 10px;}
  .tag{border:0; background:rgba(0,0,0,.05); color:var(--foreground); border-radius:999px; padding:3px 11px; font-family:inherit; font-size:12px; font-weight:500; cursor:pointer;}
  .tag.active{background:rgba(0,113,227,.12); color:var(--accent);}
  .trash-link{width:100%; margin-top:auto; display:flex; align-items:center; gap:8px; border:0; border-top:1px solid var(--border); padding:12px 16px; background:transparent; color:inherit; text-align:left; font-family:inherit; font-size:14px; cursor:pointer;}
  .trash-link svg{width:16px; height:16px; color:var(--muted);}
  .trash-link.active{color:var(--accent); font-weight:500;}
  /* Main */
  .main{flex:1; min-width:0; overflow-y:auto;}
  .crumbs{font-size:12px; color:var(--muted); padding:16px 32px 0;}
  .crumbs b{color:var(--foreground); font-weight:600;}
  .listview{margin:0 auto; padding:12px 32px 24px; max-width:680px;}
  .list-head{display:flex; align-items:center; justify-content:space-between; margin:8px 0 16px;}
  .list-head h1{font-size:17px; font-weight:600;}
  .list-head .empty{font-size:13px; color:var(--muted); font-weight:400;}
  .btn{background:var(--accent); color:#fff; border:none; border-radius:8px; padding:7px 14px; font-size:13px; font-weight:500; cursor:pointer; font-family:inherit;}
  .btn.ghost{background:transparent; color:var(--accent);}
  button:focus-visible,[tabindex="0"]:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .notes{border:1px solid var(--border); border-radius:10px; background:var(--surface); list-style:none;}
  .note{display:flex; align-items:stretch; justify-content:space-between; padding:0; border-top:1px solid var(--border);}
  .note:first-child{border-top:none;}
  .note:hover{background:var(--background);}
  .note-open{display:flex; width:100%; align-items:center; justify-content:space-between; padding:13px 16px; border:0; background:transparent; color:inherit; text-align:left; font:inherit; cursor:pointer;}
  .note-open:hover{background:transparent;}
  .note .t{display:block; font-weight:500; font-size:14px;}
  .note .m{display:block; font-size:12px; color:var(--muted); margin-top:2px;}
  /* Editor */
  .noteview{margin:0 auto; padding:24px 32px 48px; max-width:720px;}
  .noteview h1{font-size:26px; font-weight:700; margin-bottom:4px;}
  .nv-meta{font-size:12px; color:var(--muted); margin-bottom:18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .tagpill{background:rgba(0,0,0,.05); border-radius:999px; padding:2px 10px; font-size:11px; font-weight:500;}
  .nv-body{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:24px 26px; font-size:14.5px; line-height:1.6;}
  .nv-body h2{font-size:18px; margin:18px 0 6px;}
  .nv-body p{margin:.4em 0;}
  .nv-body ul,.nv-body ol{padding-left:22px; margin:.4em 0;}
  .nv-body pre{background:var(--background); border:1px solid var(--border); border-radius:8px; padding:12px 14px; font-size:12.5px; overflow-x:auto; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .nv-body code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--background); padding:1px 5px; border-radius:4px; font-size:12.5px;}
  .nv-body pre code{background:none; padding:0;}
  .nv-body blockquote{border-left:3px solid var(--border); padding-left:14px; color:var(--muted); margin:.5em 0;}
  .nv-body table{border-collapse:collapse; width:100%; margin:.5em 0;}
  .nv-body th,.nv-body td{border:1px solid var(--border); padding:6px 10px; text-align:left;}
  .nv-body th{background:var(--background); font-weight:600;}
  .tasklist{list-style:none; padding-left:2px;}
  .tasklist li{margin:.2em 0;}
  .tasklist input{margin-right:8px;}
  .tasklist li.done span{text-decoration:line-through; color:var(--muted);}
  .back{display:inline-flex; align-items:center; gap:6px; padding:5px 8px; border:0; border-radius:6px; background:transparent; color:var(--accent); font-family:inherit; font-size:13px; cursor:pointer; margin-bottom:6px;}
  .back:hover{background:rgba(0,113,227,.08);}
  .note-actions{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px;}
  .note-actions .back{margin:0;}
  .editorview{margin:0 auto; padding:24px 32px 48px; max-width:920px;}
  .editor-head{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin:8px 0 12px;}
  .editor-head h1{min-width:0; flex:1; font-size:23px; line-height:1.25; font-weight:700; overflow-wrap:anywhere;}
  .editor-state{color:var(--muted); font-size:12px; white-space:nowrap;}
  .editor-actions{display:flex; align-items:center; flex-wrap:wrap; gap:6px;}
  .editor-actions .btn.secondary{background:var(--surface); color:var(--foreground); border:1px solid var(--border);}
  .editor-actions .btn.secondary:hover{background:var(--background);}
  .editor-tags{display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin:0 0 12px; color:var(--accent); font-size:12px;}
  .editor-toolbar{display:flex; align-items:center; flex-wrap:wrap; gap:3px; padding:7px; border:1px solid var(--border); border-radius:10px 10px 0 0; background:var(--surface);}
  .editor-toolbar button,.editor-toolbar summary{display:inline-flex; align-items:center; justify-content:center; min-height:30px; padding:5px 8px; border:0; border-radius:6px; background:transparent; color:var(--muted); font-family:inherit; font-size:13px; font-weight:500; line-height:1.2; cursor:pointer; list-style:none;}
  .editor-toolbar button:hover,.editor-toolbar summary:hover{background:var(--background); color:var(--foreground);}
  .editor-toolbar summary:focus-visible,.outline-list a:focus-visible,.editor-footer button:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
  .editor-toolbar details{position:relative;}
  .editor-toolbar summary::-webkit-details-marker{display:none;}
  .tool-menu{position:absolute; top:calc(100% + 5px); left:0; z-index:10; min-width:180px; padding:5px; border:1px solid var(--border); border-radius:8px; background:var(--surface); box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .tool-menu button{display:flex; width:100%; justify-content:flex-start; text-align:left;}
  .editor-outline{display:flex; align-items:flex-start; gap:12px; padding:8px 10px; border:1px solid var(--border); border-top:0; background:#fafafa; color:var(--muted); font-size:12px;}
  .editor-outline > span{flex:1; min-width:200px;}
  .editor-outline button{border:0; background:transparent; color:var(--foreground); font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .outline-list{display:flex; flex-wrap:wrap; gap:6px 14px;}
  .outline-list[hidden]{display:none;}
  .outline-list a{color:var(--muted); text-decoration:none;}
  .editor-canvas{min-height:350px; padding:24px clamp(16px,4vw,32px); border:1px solid var(--border); border-top:0; border-radius:0 0 10px 10px; background:var(--surface); line-height:1.65;}
  .editor-canvas h2{margin:0 0 10px; font-size:20px; line-height:1.3;}
  .editor-canvas p{margin:8px 0;}
  .editor-canvas ul,.editor-canvas ol{margin:8px 0; padding-left:24px;}
  .editor-canvas pre{margin:12px 0; padding:12px 14px; overflow:auto; border:1px solid var(--border); border-radius:8px; background:var(--background); font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;}
  .editor-canvas code{padding:1px 4px; border-radius:4px; background:var(--background); font:12px ui-monospace,SFMono-Regular,Menlo,monospace;}
  .sample-attachment{display:flex; align-items:center; gap:10px; max-width:420px; margin-top:16px; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--surface);}
  .sample-attachment .file-mark{display:grid; width:32px; height:36px; place-items:center; border-radius:5px; background:#eef4ff; color:var(--accent); font-size:10px; font-weight:700;}
  .sample-attachment strong{display:block; font-size:13px; font-weight:600;}
  .sample-attachment span{display:block; margin-top:2px; color:var(--muted); font-size:11px;}
  .editor-footer{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 12px; border:1px solid var(--border); border-top:0; border-radius:8px; background:var(--surface); color:var(--muted); font-size:11px;}
  .editor-footer button{border:0; background:transparent; color:inherit; font:inherit; cursor:pointer;}
  .editor-preview{margin-top:16px; padding:24px clamp(16px,4vw,32px); border:1px solid var(--border); border-radius:10px; background:var(--surface); line-height:1.65;}
  .editor-preview h2{font-size:20px; margin:0 0 10px;}
  .demo-toast{position:fixed; right:20px; bottom:20px; z-index:80; max-width:min(360px,calc(100vw - 40px)); padding:11px 14px; border:1px solid var(--border); border-radius:9px; background:var(--surface); box-shadow:0 2px 8px rgba(0,0,0,.08); color:var(--foreground); font-size:13px; opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .16s ease-out,transform .16s ease-out;}
  .demo-toast.show{opacity:1; transform:translateY(0);}
  .view{display:none;}
  .view.on{display:block;}
  @media (max-width:767px){
    .menu-button{display:inline-flex; flex-shrink:0;}
    .searchbar{gap:8px; padding:8px 12px;}
    .searchbar .brand{font-size:12px; margin-right:0;}
    .searchwrap{max-width:none;}
    .sidebar{position:fixed; inset:92px auto 0 0; z-index:41; width:min(256px,calc(100vw - 48px)); height:calc(100vh - 92px); transform:translateX(-105%); transition:transform .18s ease-out; box-shadow:0 12px 28px rgba(0,0,0,.14);}
    body:not(.sidebar-open) .sidebar{visibility:hidden;}
    body.sidebar-open .sidebar{transform:translateX(0);}
    .sidebar-backdrop{position:fixed; inset:92px 0 0; z-index:40; background:rgba(15,23,42,.36);}
    body.sidebar-open .sidebar-backdrop{display:block;}
    .listview,.noteview,.editorview{padding-left:16px; padding-right:16px;}
    .crumbs{padding-left:16px; padding-right:16px;}
    .editor-head h1{font-size:20px;}
    .editor-actions{width:100%;}
    .editor-toolbar{border-radius:9px 9px 0 0;}
    .editor-toolbar button,.editor-toolbar summary{min-height:42px; padding:8px 10px;}
    .editor-outline{flex-wrap:wrap;}
    .editor-outline > span{flex-basis:100%; min-width:0;}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;}}
</style>
</head>
<body>
<div class="ribbon"><b>⚠ Demo</b> — synthetic, read-only interface preview. Not connected to any real system.</div>
<div class="shell">
  <div class="searchbar">
    <button class="menu-button" id="sidebar-toggle" type="button" aria-label="Toggle folders" aria-controls="sidebar" aria-expanded="false">
      <svg aria-hidden="true" viewBox="0 0 20 20" width="20" height="20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <div class="brand">📁 Team Notes</div>
    <div class="searchwrap">
      <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M17 17l-3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="q" type="search" role="combobox" aria-label="Search notes" aria-autocomplete="list" aria-expanded="false" aria-controls="qpop" aria-describedby="search-help" placeholder="Search notes…" autocomplete="off">
      <kbd class="search-shortcut" aria-hidden="true">Ctrl/⌘ K</kbd>
      <p class="sr-only" id="search-help">Use the arrow keys to move through search results, Enter to open one, and Escape to close them.</p>
      <div class="search-popup" id="qpop" role="listbox" aria-label="Search results"></div>
    </div>
  </div>
  <div class="body">
    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="crumbs" id="crumbs"></div>
      <div class="view" id="v-list"></div>
      <div class="view" id="v-note"></div>
      <div class="view" id="v-editor"></div>
      <div class="view" id="v-tags"></div>
      <div class="view" id="v-trash"></div>
    </main>
  </div>
</div>
<div class="demo-toast" id="demo-toast" role="status" aria-live="polite"></div>
<script>
/* ---- Synthetic, deterministic demo data (all invented) ---- */
const DATA = {
  folders: [
    {id:'ops', name:'Operations', count:5},
    {id:'hr', name:'HR & Onboarding', count:4},
    {id:'it', name:'IT & Infrastructure', count:5},
    {id:'retail', name:'Retail Playbooks', count:3},
    {id:'security', name:'Security', count:4},
    {id:'finance', name:'Finance & Reporting', count:2},
  ],
  notes: {
    ops:[
      {id:'n1', t:'Opening store checklist', f:'Operations', up:'Aug 12, 2026, 09:41', tags:['checklist','opening'],
        body:`<p>Run this before the first customer walks in. Front-of-house staff should leave the shift brief beside the register.</p><ul class="tasklist"><li><label><input type="checkbox" checked> Unlock <b>both</b> entrance doors</label></li><li><label><input type="checkbox" checked> Turn on POS terminals, verify the network light</label></li><li><label><input type="checkbox"> Count opening till against the <code>cash sheet</code></label></li><li><label><input type="checkbox"> Write today's shift on the whiteboard</label></li></ul><p>If a terminal fails to sync, call extension <b>4200</b> — do not open the drawer manually.</p>`},
      {id:'n2', t:'Nightly close & cash drop', f:'Operations', up:'Aug 10, 2026, 22:15', tags:['close','cash'],
        body:`<blockquote>Two people must witness every cash drop. One counts, the second signs.</blockquote><p>End-of-day steps after the last customer:</p><ol><li>Z-report from each POS.</li><li>Bag the <code>main</code> drawer, seal with tape, log the amount.</li><li>Drop the bag in the safe; write the serial in the logbook.</li><li>Set the alarm and lock the back door.</li></ol>`},
      {id:'n3', t:'Shift handover notes', f:'Operations', up:'Aug 08, 2026, 17:50', tags:['handover'],
        body:`<p>Standard handover template — finish before your replacement arrives.</p><ul><li>Open issues (escalate if more than 3 in a shift).</li><li>Stock that needs reordering.</li><li>Anything the next shift must know <b>before</b> opening.</li></ul>`},
      {id:'n4', t:'Refund & return policy', f:'Operations', up:'Aug 05, 2026, 14:02', tags:['policy','returns'],
        body:`<table><tr><th>Scenario</th><th>Window</th><th>Approval</th></tr><tr><td>Unopened, receipt present</td><td>30 days</td><td>Cashier</td></tr><tr><td>Opened / used</td><td>14 days</td><td>Manager</td></tr><tr><td>No receipt</td><td>In-store credit</td><td>Manager</td></tr></table><p>Never accept a return of perishable goods once scanned.</p>`},
      {id:'n5', t:'Daily sales report', f:'Operations', up:'Aug 03, 2026, 20:30', tags:['report'],
        body:`<p>The daily sales summary is generated at 19:00. Post it to the <code>#sales</code> channel before leaving.</p><pre>HEAD /daily-sales
  status: 200  time: 340ms
  rows:   2,144
saved to /reports/daily/2026-08-03.csv</pre>`},
    ],
    hr:[
      {id:'h1', t:'New-hire onboarding checklist', f:'HR & Onboarding', up:'Aug 11, 2026, 11:20', tags:['onboarding','checklist'],
        body:`<p>Day-one agenda for every new hire. The buddy is assigned by the hiring manager.</p><ul class="tasklist"><li><label><input type="checkbox"> Workspace, laptop, and badge ready</label></li><li><label><input type="checkbox"> Accounts created (email, VPN, chat)</label></li><li><label><input type="checkbox"> Policy pack signed, safety briefing done</label></li><li><label><input type="checkbox"> First-week 1:1 booked with buddy</label></li></ul>`},
      {id:'h2', t:'Interview scorecard', f:'HR & Onboarding', up:'Aug 09, 2026, 15:44', tags:['hiring'],
        body:`<p>Score each candidate 1&ndash;5 on the four axes. Total of <b>17 or more</b> flags a "yes".</p><ol><li>Role skill (hands-on exercise required).</li><li>Communication &amp; cultural fit.</li><li>Growth potential.</li><li>Compensation alignment.</li></ol>`},
      {id:'h3', t:'Probation review form', f:'HR & Onboarding', up:'Jul 30, 2026, 10:05', tags:['review'],
        body:`<p>Completed at the 60-day mark. Goals from onboarding should be the anchor.</p>`},
      {id:'h4', t:'Public holiday calendar', f:'HR & Onboarding', up:'Jul 28, 2026, 09:00', tags:['calendar'],
        body:`<p>Floating holidays must be requested <b>two weeks</b> in advance in the scheduling tool.</p>`},
    ],
    it:[
      {id:'i1', t:'Printer troubleshooting', f:'IT & Infrastructure', up:'Aug 12, 2026, 08:55', tags:['printers','guide'],
        body:`<p>First try the obvious stuff before you escalate:</p><ol><li>Power cycle the printer (unplug 10s).</li><li>Check the queue for stuck jobs and clear them.</li><li>Verify the IP hasn't changed in the DHCP lease.</li><li>If still dead, ping the host and note the result.</li></ol><pre>$ ping -c 3 printer-01
  64 bytes from 10.10.4.21: icmp_seq=1 ttl=64 time=1.2 ms
  64 bytes from 10.10.4.21: icmp_seq=2 ttl=64 time=0.9 ms</pre><p>Escalate with the ping output on hand.</p>`},
      {id:'i2', t:'Wi-Fi & network access', f:'IT & Infrastructure', up:'Aug 10, 2026, 16:12', tags:['network','wifi'],
        body:`<p>Guest Wi-Fi rotates its passphrase weekly — the current one is on the front desk card. Employee devices use certificate-based auth; report lost devices to IT the same day.</p>`},
      {id:'i3', t:'Laptop VPN setup', f:'IT & Infrastructure', up:'Aug 06, 2026, 13:30', tags:['vpn','setup'],
        body:`<p>VPN client is pre-installed. Sign in with your work account, then approve the push.</p><ul><li>Windows: open <code>Work VPN</code> from the tray.</li><li>macOS: use the menu-bar app.</li><li>Two-factor push must be answered within 30 seconds.</li></ul>`},
      {id:'i4', t:'Password reset flow', f:'IT & Infrastructure', up:'Aug 04, 2026, 10:18', tags:['accounts'],
        body:`<p>Only the account owner can reset a password. Identity is verified by a 6-digit code sent to the registered mobile.</p>`},

    {t:'Old moving-out checklist', f:'Operations', up:'Aug 11, 2026, 18:20'},

const NOTES = {};
Object.values(DATA.notes).forEach(arr=>arr.forEach(n=>NOTES[n.id]=n));

const DRAFT = {
  t:'Weekly access point maintenance', f:'Operations', up:'Just now', tags:['checklist','handover'],
  body:`<p>Sample editor content for the static demo. Confirm the maintenance window with the team before making a change.</p><ul class="tasklist" id="editor-checklist"><li><label><input type="checkbox" disabled> Review the change checklist</label></li><li><label><input type="checkbox" disabled> Record the test result</label></li></ul><p>Use a short note to leave the next person a clear handover.</p>`
};

let state = {where:'list', folder:null, note:null, tag:null, trash:false, editor:false, editorNote:null, preview:false, sidebarOpen:false, outlineOpen:true, searchIndex:-1};
state.sidebarOpen = window.matchMedia('(min-width: 768px)').matches;
const fmt = n => `Updated ${n.up}`;
let toastTimer;

function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
function showToast(message){
  const toast=document.getElementById('demo-toast');
  toast.textContent=message; toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'),2800);
}
function monoCount(fid){
  let c=0; (DATA.notes[fid]||[]).forEach(()=>c++); return c;
}

function renderSidebar(){
  const s=document.getElementById('sidebar');
  const parts=[`<div class="side-head"><h2>Folders</h2></div>`];
  DATA.folders.forEach(f=>{
    parts.push(`<button type="button" class="folder ${state.folder===f.id?'active':''}" data-folder="${f.id}" aria-current="${state.folder===f.id?'page':'false'}"><span>${f.name}</span><span class="count">${monoCount(f.id)}</span></button>`);
  });
  parts.push(`<div class="tags-wrap"><h2>Tags</h2></div><div class="taglist">`);
  ['checklist','security','cash','report','guide','setup','policy','alarm'].forEach(t=>{
    parts.push(`<button type="button" class="tag ${state.tag===t?'active':''}" data-tag="${t}" aria-pressed="${state.tag===t}">#${t}</button>`);
  });
  parts.push(`</div><button type="button" class="trash-link ${state.trash?'active':''}" data-trash="1" aria-current="${state.trash?'page':'false'}"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="M4.5 6.5h11M8 6.5V4h4v2.5m2.5 0-.7 9.5H6.2l-.7-9.5M8.5 9v4.5M11.5 9v4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Trash</button>`);
  s.innerHTML=parts.join('');
}

function renderCrumbs(){
  const c=document.getElementById('crumbs');
  let html='';
  if(state.trash) html=`Trash`;
  else if(state.editor){const n=state.editorNote==='draft'?DRAFT:NOTES[state.editorNote]; html=`${n.f} &nbsp;/&nbsp; ${n.t} &nbsp;·&nbsp; ${state.preview?'Preview':'Editor demo'}`;}
  else if(state.tag) html=`<b>#${state.tag}</b> &nbsp;·&nbsp; ${tagCount(state.tag)} notes`;
  else if(state.note){ const f=DATA.folders.find(x=>x.name===NOTES[state.note].f);
    html=`${NOTES[state.note].f} &nbsp;/&nbsp; ${NOTES[state.note].t}`; }
  else if(state.folder){ const f=DATA.folders.find(x=>x.id===state.folder);
    html=`<b>${f?f.name:''}</b> &nbsp;·&nbsp; ${monoCount(state.folder)} notes`; }
  else html=`<b>All folders</b>`;
  c.innerHTML=html;
}

function tagCount(tag){
  let c=0; Object.values(DATA.notes).forEach(arr=>arr.forEach(n=>{if(n.tags.includes(tag))c++;})); return c;
}

function renderList(){
  const v=document.getElementById('v-list');
  let folder=DATA.folders.find(x=>x.id===state.folder);
  let title = folder ? folder.name : 'All notes';
  const arr = state.folder ? (DATA.notes[state.folder]||[]) : Object.values(DATA.notes).flat();
  v.innerHTML=`
    <div class="listview">
      <div class="list-head"><h1>${title} <span class="empty">· ${arr.length} notes</span></h1>
      <button class="btn" type="button" data-new-note>New Note</button></div>
      <ul class="notes">${arr.map(n=>`
        <li class="note"><button class="note-open" type="button" data-open="${n.id}">
          <span><span class="t">${n.t}</span><span class="m">${fmt(n)}</span></span>
        </button></li>`).join('')}
      </ul>
    </div>`;
}

function renderTags(){
  const v=document.getElementById('v-tags');
  const arr=Object.values(DATA.notes).flat().filter(n=>n.tags.includes(state.tag));
  v.innerHTML=`<div class="listview">
    <div class="list-head"><h1>#${state.tag} <span class="empty">· ${arr.length} notes</span></h1></div>
    <ul class="notes">${arr.map(n=>`<li class="note"><button class="note-open" type="button" data-open="${n.id}"><span><span class="t">${n.t}</span><span class="m">${n.f} · ${fmt(n)}</span></span></button></li>`).join('')}</ul>
  </div>`;
}

function renderTrash(){
  const v=document.getElementById('v-trash');
  v.innerHTML=`<div class="listview">
    <div class="list-head"><h1>Trash <span class="empty">· ${DATA.trash.length} notes</span></h1></div>
    <ul class="notes">${DATA.trash.map(n=>`<li class="note"><div class="note-open"><span><span class="t">${n.t}</span><span class="m">${n.f} · ${fmt(n)}</span></span></div></li>`).join('')}</ul>
  </div>`;
}

function renderNote(){
  const n=NOTES[state.note]; if(!n) return;
  const v=document.getElementById('v-note');
  v.innerHTML=`<div class="noteview">
    <div class="note-actions"><button class="back" type="button" data-back="1">← Back to list</button><button class="btn ghost" type="button" data-edit="${n.id}">Edit preview</button></div>
    <h1>${n.t}</h1>
    <div class="nv-meta"><span>${n.f}</span><span>${fmt(n)}</span>${n.tags.map(t=>`<span class="tagpill">#${t}</span>`).join('')}</div>
    <div class="nv-body">${n.body.replace(/<input type="checkbox"(?![^>]*disabled)/gi,'<input type="checkbox" disabled')}</div>
  </div>`;
}

function renderEditor(){
  const isDraft=state.editorNote==='draft';
  const n=isDraft?DRAFT:NOTES[state.editorNote];
  if(!n) return;
  const v=document.getElementById('v-editor');
  const body=n.body.replace(/<input type="checkbox"(?![^>]*disabled)/gi,'<input type="checkbox" disabled');
  const toolbar=`<div class="editor-toolbar" aria-label="Formatting tools">
    <button type="button" data-tool="Heading 1" aria-label="Heading 1">H1</button>
    <button type="button" data-tool="Heading 2" aria-label="Heading 2">H2</button>
    <button type="button" data-tool="Bold" aria-label="Bold"><b>B</b></button>
    <button type="button" data-tool="Italic" aria-label="Italic"><i>I</i></button>
    <details><summary>Text⌄</summary><div class="tool-menu"><button type="button" data-tool="Paragraph">Paragraph</button><button type="button" data-tool="Heading 3">Heading 3</button><button type="button" data-tool="Quote">Quote</button></div></details>
    <details><summary>• List⌄</summary><div class="tool-menu"><button type="button" data-tool="Bullet list">Bullet list</button><button type="button" data-tool="Numbered list">Numbered list</button><button type="button" data-tool="Checklist">Checklist</button></div></details>
    <details><summary>Table⌄</summary><div class="tool-menu"><button type="button" data-tool="Insert 2 × 2 table">2 × 2 table</button><button type="button" data-tool="Insert 3 × 3 table">3 × 3 table</button></div></details>
    <details><summary>Code⌄</summary><div class="tool-menu"><button type="button" data-tool="Code block">Code block</button><button type="button" data-tool="Inline code">Inline code</button></div></details>
    <button type="button" data-tool="Link">Link</button>
    <details><summary>More⌄</summary><div class="tool-menu"><button type="button" data-tool="Horizontal rule">Horizontal rule</button><button type="button" data-tool="Insert image">Insert image</button><button type="button" data-tool="Slash commands">Slash commands (/)</button></div></details>
    <button type="button" disabled aria-label="Undo">↶</button><button type="button" disabled aria-label="Redo">↷</button>
  </div>`;
  v.innerHTML=`<div class="editorview">
    <button class="back" type="button" data-editor-back>← ${n.f}</button>
    <div class="editor-head"><h1>${n.t}</h1><span class="editor-state">Static preview · not saved</span>
      <div class="editor-actions"><button class="btn secondary" type="button" data-preview-toggle>${state.preview?'Back to editor':'Preview'}</button><button class="btn secondary" type="button" data-print>Print</button><button class="btn secondary" type="button" data-attach>Attach file</button><button class="btn" type="button" data-demo-save>Save</button></div>
    </div>
    <div class="editor-tags">${n.tags.map(t=>`<span class="tagpill">#${t}</span>`).join('')} <span>+ tag</span></div>
    ${state.preview?`<article class="editor-preview" aria-label="Read-only note preview">${body}<div class="sample-attachment"><span class="file-mark">PDF</span><div><strong>Maintenance checklist.pdf</strong><span>PDF · 184 KB · synthetic file</span></div></div></article>`:`${toolbar}
      <div class="editor-outline"><button type="button" data-outline aria-expanded="${state.outlineOpen}">☰ Outline</button><nav class="outline-list" id="outline-list" ${state.outlineOpen?'':'hidden'}><a href="#editor-checklist">Checklist</a></nav><span>Drag ⋮⋮ on the left of a block to reorder · paste screenshots with Ctrl+V</span></div>
      <article class="editor-canvas" aria-label="Read-only sample editor content">${body}<div class="sample-attachment"><span class="file-mark">PDF</span><div><strong>Maintenance checklist.pdf</strong><span>PDF · 184 KB · synthetic file</span></div></div></article>
      <div class="editor-footer"><span>46 words · ~1 min read</span><button type="button" data-shortcuts>⌨ Shortcuts (Ctrl+/)</button></div>`}
  </div>`;
}

function renderSearch(q){
  const pop=document.getElementById('qpop');
  const input=document.getElementById('q');
  if(!q.trim()){pop.classList.remove('open');input.setAttribute('aria-expanded','false');input.removeAttribute('aria-activedescendant');return;}
  const ql=q.toLowerCase();
  const hits=Object.values(DATA.notes).flat().filter(n=>(n.t+' '+n.body).toLowerCase().includes(ql)).slice(0,6);
  state.searchIndex=Math.min(state.searchIndex, hits.length-1);
  pop.innerHTML = hits.length? hits.map((n,i)=>`<button type="button" class="sr ${i===state.searchIndex?'active':''}" role="option" aria-selected="${i===state.searchIndex}" id="q-result-${i}" data-open="${n.id}"><b>${n.t}</b><span>${n.f} · ${n.body.replace(/<[^>]+>/g,'').slice(0,60)}…</span></button>`).join(''): `<p class="sr empty-result" role="status">No matching notes</p>`;
  pop.classList.add('open');
  input.setAttribute('aria-expanded','true');
  if(state.searchIndex>=0) input.setAttribute('aria-activedescendant',`q-result-${state.searchIndex}`); else input.removeAttribute('aria-activedescendant');
}

function show(){
  ['v-list','v-note','v-editor','v-tags','v-trash'].forEach(id=>document.getElementById(id).classList.remove('on'));
  let target;
  if(state.editor) target='v-editor';
  else if(state.trash) target='v-trash';
  else if(state.note) target='v-note';
  else if(state.tag) target='v-tags';
  else target='v-list';
  document.getElementById(target).classList.add('on');
  if(window.matchMedia('(min-width: 768px)').matches) state.sidebarOpen=true;
  document.body.classList.toggle('sidebar-open',state.sidebarOpen);
  document.getElementById('sidebar-toggle').setAttribute('aria-expanded',String(state.sidebarOpen));
  renderSidebar(); renderCrumbs();
  if(target==='v-list') renderList();
  else if(target==='v-tags') renderTags();
  else if(target==='v-trash') renderTrash();
  else if(target==='v-editor') renderEditor();
  else renderNote();
  document.getElementById('mainscroll') && 0;
}

document.addEventListener('click',e=>{
  const target=e.target instanceof Element?e.target:null;
  if(!target) return;
  const f=target.closest('[data-folder]');
  const t=target.closest('[data-tag]');
  const tr=target.closest('[data-trash]');
  const open=target.closest('[data-open]');
  const back=target.closest('[data-back]');
  const newNote=target.closest('[data-new-note]');
  const edit=target.closest('[data-edit]');
  const editorBack=target.closest('[data-editor-back]');
  const preview=target.closest('[data-preview-toggle]');
  const outline=target.closest('[data-outline]');
  const save=target.closest('[data-demo-save]');
  const attach=target.closest('[data-attach]');
  const print=target.closest('[data-print]');
  const shortcuts=target.closest('[data-shortcuts]');
  const tool=target.closest('[data-tool]');
  if(newNote){state.editor=true;state.editorNote='draft';state.note=null;state.preview=false;state.trash=false;show();return;}
  if(edit){state.editor=true;state.editorNote=edit.dataset.edit;state.preview=false;show();return;}
  if(preview){state.preview=!state.preview;show();return;}
  if(editorBack){const wasDraft=state.editorNote==='draft';state.editor=false;state.preview=false;state.editorNote=null;if(wasDraft)state.note=null;state.where=state.note?'note':'list';show();return;}
  if(outline){state.outlineOpen=!state.outlineOpen;show();return;}
  if(save){showToast('This static preview does not save or send your content.');return;}
  if(attach){showToast('File uploads are disabled in this synthetic demo.');return;}
  if(print){showToast('Print is available in the live app; this preview does not open a print job.');return;}
  if(shortcuts){showToast('Shortcuts: Ctrl/⌘ K search · Ctrl/⌘ B bold · Ctrl/⌘ I italic · / commands');return;}
  if(tool){showToast(`${tool.dataset.tool} is shown for preview; edits are not saved.`);tool.closest('details')?.removeAttribute('open');return;}
  if(f){state={...state,where:'list',folder:f.dataset.folder,note:null,tag:null,trash:false,editor:false,editorNote:null,preview:false,sidebarOpen:window.matchMedia('(min-width: 768px)').matches};show();return;}
  if(t){state={...state,where:'tags',folder:null,note:null,tag:t.dataset.tag,trash:false,editor:false,editorNote:null,preview:false,sidebarOpen:window.matchMedia('(min-width: 768px)').matches};show();return;}
  if(tr){state={...state,where:'trash',folder:null,note:null,tag:null,trash:true,editor:false,editorNote:null,preview:false,sidebarOpen:window.matchMedia('(min-width: 768px)').matches};show();return;}
  if(open){document.getElementById('qpop').classList.remove('open');document.getElementById('q').setAttribute('aria-expanded','false');state={...state,note:open.dataset.open,tag:null,trash:false,editor:false,editorNote:null,preview:false,where:'note',sidebarOpen:window.matchMedia('(min-width: 768px)').matches};show();return;}
  if(back){state={...state,note:null,editor:false,editorNote:null,preview:false,where:'list'};show();}
});
document.getElementById('sidebar-toggle').addEventListener('click',()=>{state.sidebarOpen=!state.sidebarOpen;document.body.classList.toggle('sidebar-open',state.sidebarOpen);document.getElementById('sidebar-toggle').setAttribute('aria-expanded',String(state.sidebarOpen));});
document.getElementById('sidebar-backdrop').addEventListener('click',()=>{state.sidebarOpen=false;document.body.classList.remove('sidebar-open');document.getElementById('sidebar-toggle').setAttribute('aria-expanded','false');});
document.getElementById('q').addEventListener('input',e=>{state.searchIndex=-1;renderSearch(e.target.value);});
document.getElementById('q').addEventListener('keydown',e=>{
  const results=[...document.querySelectorAll('#qpop [role="option"]')];
  if(e.key==='Escape'){document.getElementById('qpop').classList.remove('open');e.target.setAttribute('aria-expanded','false');e.target.removeAttribute('aria-activedescendant');return;}
  if(!results.length)return;
  if(e.key==='ArrowDown'){e.preventDefault();state.searchIndex=Math.min(state.searchIndex+1,results.length-1);renderSearch(e.target.value);}
  else if(e.key==='ArrowUp'){e.preventDefault();state.searchIndex=Math.max(state.searchIndex-1,-1);renderSearch(e.target.value);}
  else if(e.key==='Enter'&&state.searchIndex>=0){e.preventDefault();results[state.searchIndex]?.click();}
});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.altKey&&!e.shiftKey&&e.key.toLowerCase()==='k'&&!e.target.isContentEditable&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){e.preventDefault();document.getElementById('q').focus();document.getElementById('q').select();}});
document.addEventListener('click',e=>{if(!(e.target instanceof Element)||!e.target.closest('.searchwrap')){document.getElementById('qpop').classList.remove('open');document.getElementById('q').setAttribute('aria-expanded','false');}});
document.addEventListener('click',e=>{if(!(e.target instanceof Element)||!e.target.closest('.editor-toolbar details'))document.querySelectorAll('.editor-toolbar details[open]').forEach(menu=>menu.removeAttribute('open'));});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.editor-toolbar details[open]').forEach(menu=>menu.removeAttribute('open'));});

show();
</script>
</body>
</html>
